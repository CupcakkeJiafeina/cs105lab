<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
    }

    .calculator {
        background-color: #222;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        width: 260px;
    }

    .display {
        background-color: #444;
        color: #fff;
        font-size: 2em;
        text-align: right;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 10px;
        height: 50px;
        overflow: hidden;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
    }

    .buttons button {
        padding: 15px;
        font-size: 1.2em;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #eee;
        transition: background-color 0.2s;
    }

    .buttons button:hover {
        background-color: #ddd;
    }

    .buttons .operator {
        background-color: #ff9500;
        color: #fff;
    }

    .buttons .operator:hover {
        background-color: #e08900;
    }

    .buttons .equals {
        grid-column: span 2;
        background-color: #28a745;
        color: #fff;
    }

    .buttons .equals:hover {
        background-color: #218838;
    }

    .buttons .clear {
        background-color: #dc3545;
        color: #fff;
    }

    .buttons .clear:hover {
        background-color: #c82333;
    }
</style>

<script>
    var num1 = "";
    var operator = "";
    var num2 = "";
    var test = "";

    function addValue(val) {
        var display = document.getElementById("display");
        
        if (display.innerText == "0") {
            display.innerText = "";
        }
        if (display.innerText == "CIS105") {
            display.innerText = "";
        }

        if (val == "+") {
            operator = "+";
            display.innerText = display.innerText + val;
        } 
        else if (val == "-") {
            operator = "-";
            display.innerText = display.innerText + val;
        } 
        else if (val == "*") {
            operator = "*";
            display.innerText = display.innerText + val;
        } 
        else if (val == "/") {
            operator = "/";
            display.innerText = display.innerText + val;
        } 
        else {
            if (operator == "") {
                num1 = num1 + val;
                display.innerText = display.innerText + val;
            } else {
                num2 = num2 + val;
                display.innerText = display.innerText + val;
            }
        }
    }

    function clearAll() {
        num1 = "";
        operator = "";
        num2 = "";
        document.getElementById("display").innerText = "0";
    }

    function clearDigit() {
        var display = document.getElementById("display");
        
        if (display.innerText == "0") {
        } 
        else if (display.innerText == "CIS105") {
        } 
        else {
            if (num2 != "") {
                var length2 = num2.length;
                num2 = num2.substring(0, length2 - 1);
            } 
            else if (operator != "") {
                operator = "";
            } 
            else if (num1 != "") {
                var length1 = num1.length;
                num1 = num1.substring(0, length1 - 1);
            }

            var currentText = display.innerText;
            var textLength = currentText.length;
            var newText = currentText.substring(0, textLength - 1);
            
            if (newText == "") {
                display.innerText = "0";
                num1 = "";
            } 
            else if (newText == "-") {
                display.innerText = "0";
                num1 = "";
            } 
            else {
                display.innerText = newText;
            }
        }
    }

    function toggleSign() {
        var display = document.getElementById("display");
        
        if (display.innerText == "0") {
        } 
        else if (display.innerText == "CIS105") {
        } 
        else {
            if (operator == "") {
                if (num1 != "") {
                    var number1 = parseFloat(num1);
                    var negative1 = number1 * -1;
                    num1 = negative1.toString();
                    display.innerText = num1;
                }
            } 
            else {
                if (num2 != "") {
                    var number2 = parseFloat(num2);
                    var negative2 = number2 * -1;
                    num2 = negative2.toString();
                    display.innerText = num1 + operator + num2;
                }
            }
        }
    }

    function calculate() {
        var display = document.getElementById("display");
        
        if (num1 == "") {
        } 
        else if (operator == "") {
        } 
        else if (num2 == "") {
        } 
        else {
            var n1 = parseFloat(num1);
            var n2 = parseFloat(num2);
            var result = 0;
            
            if (operator == "+") {
                if (n1 > 1000) {
                    if (n2 > 1000) {
                        display.innerText = "CIS105";
                        return;
                    }
                }
            }
            if (operator == "-") {
                if (n1 > 1000) {
                    if (n2 > 1000) {
                        display.innerText = "CIS105";
                        return;
                    }
                }
            }
            
            if (operator == "*") {
                var digits1 = num1.length;
                if (n1 < 0) {
                    digits1 = digits1 - 1; 
                }
                
                var digits2 = num2.length;
                if (n2 < 0) {
                    digits2 = digits2 - 1; 
                }
                
                if (digits1 > 2) {
                    if (digits2 > 1) {
                        display.innerText = "CIS105";
                        return;
                    }
                }
                
                if (digits2 > 2) {
                    if (digits1 > 1) {
                        display.innerText = "CIS105";
                        return;
                    }
                }
            }
            
            if (operator == "/") {
                if (n2 == 0) {
                    display.innerText = "CIS105";
                    return;
                }
                
                var divResult = n1 / n2;
                if (divResult > 1000) {
                    display.innerText = "CIS105";
                    return;
                }
            }

            if (operator == "+") {
                result = n1 + n2;
            } 
            if (operator == "-") {
                result = n1 - n2;
            } 
            if (operator == "*") {
                result = n1 * n2;
            } 
            if (operator == "/") {
                result = n1 / n2;
            }

            display.innerText = result;
            num1 = result.toString();
            operator = "";
            num2 = "";
        }
    }
</script>

</head>
<body>
<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <div></div>
        <button class="clear-all" onclick="clearAll()">CE</button>
        <button class="clear" onclick="clearDigit()">C</button>
        <button class="operator" onclick="addValue('/')">/</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">*</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('-')">-</button>
        
        <button onclick="addValue('0')">0</button>
        <button id="toggle-sign" onclick="toggleSign()">(+/-)</button>
        
        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>
</body>
</html>
