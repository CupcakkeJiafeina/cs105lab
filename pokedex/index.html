<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokedex</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- POKEDEX -->
    <div class="pokedex">

      <!-- LEFT SIDE -->
      <div class="left-panel">

        <div class="top-bar">
          <div class="big-light"></div>

          <div class="small-lights">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
          </div>
        </div>

        <div class="search-area">
          <input type="text" id="pokemonInput" placeholder="SEARCH..." />
          <button id="searchBtn">Search</button>
        </div>

        <div class="screen-container">
          <div class="screen">
            <img id="pokemonImage" src="" alt="Pokemon" />
            <p id="pokemonName">READY...</p>
          </div>

          <div class="screen-bottom">
            <div class="red-button"></div>

            <div class="speaker">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="blue-button"></div>

          <div class="mini-buttons">
            <span class="green-btn"></span>
            <span class="orange-btn"></span>
          </div>

          <div class="dpad">
            <div class="vertical"></div>
            <div class="horizontal"></div>
            <div class="center"></div>
          </div>
        </div>

      </div>

      <!-- CENTER DIVIDER -->
      <div class="divider"></div>

      <!-- RIGHT SIDE -->
      <div class="right-panel">

        <div class="top-shape"></div>

        <div class="info-screen">
          <p id="pokemonInfo">WAITING FOR INPUT...</p>
        </div>

        <div class="blue-grid">
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
        </div>

        <div class="indicator-row">
          <span class="orange-light"></span>
          <span class="green-light"></span>

          <div class="small-bars">
            <span class="green-bar"></span>
            <span class="orange-bar"></span>
          </div>
        </div>

        <div class="bottom-buttons">
          <div></div>
          <div></div>
        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
