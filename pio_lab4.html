<html>
	<title>TicTacToe</title>
	<style>
	body {
		font-family: "Arial";
		text-align: center;
		align-items: center;
		background-color: lightblue;
	}
	
	div {
		margin: 0px auto;
		border-collapse: collapse;
	}
	
	.tile {
		margin: 3px 3px;
		width: 100px;
		height: 100px;
		background-color: pink;
		border-radius: 10px;
		cursor: pointer;
	}
	.tile:hover {
		margin: 3px 3px;
		width: 100px;
		height: 100px;
		background-color: magenta;
		border-radius: 10px;
		cursor: pointer;
	}
	.reset {
		margin: 30px;
		width: 100px;
		height: 60px;
		background-color: green;
		border-radius: 10px;
		cursor: pointer;
		text-align: center;
		align-items: center;
	}

	.reset:hover {
		margin: 30px;
		width: 100px;
		height: 60px;
		background-color: cyan;
		border-radius: 10px;
		cursor: pointer;
		text-align: center;
		align-items: center;
	}
	

	</style>
	<body>
		<h1><font color=green>Tic-Tac-Toe</font></h1>
		
		<div>
			<button class = "tile">
			<button class = "tile">
			<button class = "tile">
		</div>
		
		<div>
			<button class = "tile">
			<button class = "tile">
			<button class = "tile">
		</div>
		
		<div>
			<button class = "tile">
			<button class = "tile">
			<button class = "tile">
		</div>
			<button class = "reset"><font color=white><b>Reset</b></font></button>
	</body>
</html>
